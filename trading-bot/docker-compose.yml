services:
  trading-bot:
    build: .
    container_name: bybit-trading-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./state:/app/state
      - ./config.json:/app/config.json:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
